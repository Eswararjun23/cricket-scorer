
<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eee3;--panel:#fff;--ink:#0d2b21;--mut:#55695f;--line:rgba(13,43,33,.15);--turf:#0d2b21;--turf2:#164a37;--chalk:#eef2ea;--ball:#d6322e;--gold:#f2b632;--sky:#5bb6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1f17;--panel:#123628;--ink:#eef2ea;--mut:#9db3a7;--line:rgba(238,242,234,.15);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1f17;--panel:#123628;--ink:#eef2ea;--mut:#9db3a7;--line:rgba(238,242,234,.15);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.num{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-weight:800;line-height:1;margin:0;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;max-width:1040px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;cursor:pointer}
.logo i{width:6px;height:26px;border-radius:2px;background:var(--gold);box-shadow:-10px 0 var(--gold),10px 0 var(--gold);margin:0 10px}
.mute{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
main{max-width:1040px;margin:0 auto;padding:8px 22px 60px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:36px 0}
.hero h1{font-size:clamp(56px,10vw,118px);font-weight:900}
.hero p{font-size:19px;color:var(--mut);max-width:30em;margin:18px 0 28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:14px 26px;font-weight:700;font-size:17px;cursor:pointer;background:var(--turf);color:var(--chalk);transition:transform .12s}

.b.f{background:var(--sky);color:#06222f}.b.s{background:var(--gold);color:#1b1500}.b.w{background:var(--ball);color:#fff}.b.x{background:none;border-color:var(--gold);color:var(--gold)}

label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=number],textarea{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:17px}
textarea{min-height:170px;resize:vertical}
.err{color:var(--ball);min-height:24px;margin:10px 0 0;font-weight:500}
.chips{display:flex;gap:10px;flex-wrap:wrap}

.chip.on{background:var(--turf);color:var(--chalk);border-color:var(--turf)}
.coinw{perspective:800px;display:grid;place-items:center;margin:20px 0}
.coin{width:130px;height:130px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-family:'Big Shoulders Display',sans-serif;font-size:64px;font-weight:900;backface-visibility:hidden;background:radial-gradient(circle at 35% 30%,#ffe08a,#d79a12);color:#5a3d00;border:6px double #8a5f06}
.face.t{transform:rotateY(180deg)}
.score{background:var(--turf);color:var(--chalk);border-radius:18px;padding:22px 26px;box-shadow:0 0 0 6px var(--turf2) inset}
.score .num{font-size:92px;font-weight:900}
.score small{opacity:.75;font-size:15px}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:18px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-size:13px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.pad button{height:74px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-family:'Big Shoulders Display',sans-serif;font-size:40px;font-weight:800}
.pad button:active{transform:scale(.94)}
.pad .r4{background:var(--sky);color:#06222f;border-color:var(--sky)}.pad .r6{background:var(--gold);color:#1b1500;border-color:var(--gold)}.pad .rw{background:var(--ball);color:#fff;border-color:var(--ball);font-size:26px}
.ex{display:flex;gap:10px;flex-wrap:wrap}
.ex button{flex:1;padding:12px;border-radius:10px;border:1.5px dashed var(--mut);background:none;cursor:pointer;font-weight:700}
.ex button.on{background:var(--ink);color:var(--bg);border-style:solid}
.hint{color:var(--mut);font-size:14px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(5,20,14,.7);display:grid;place-items:center;z-index:20;padding:18px}
.mbox{background:var(--panel);border-radius:18px;padding:24px;width:min(460px,100%);max-height:86vh;overflow:auto}
.mbox h3{font-size:34px;margin-bottom:14px}
.opt{display:flex;justify-content:space-between;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:none;cursor:pointer;text-align:left}
.opt:disabled{opacity:.4;cursor:default}.opt small{color:var(--mut)}
.flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:min(26vw,230px);animation:pop .95s ease-out forwards;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.flash.four{color:var(--sky)}.flash.six{color:var(--gold)}.flash.out{color:var(--ball)}.flash.x{color:#fff}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}80%{opacity:1}100%{transform:scale(1.2);opacity:0}}
.ovs div{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.ovs span.n{min-width:120px;color:var(--mut)}
@media (max-width:760px){.hero,.g2,.feat{grid-template-columns:1fr}.hero{gap:26px}.panel{padding:22px}.score .num{font-size:72px}}

.footer-mark span{color:#f2b632;margin-left:2px}
.footer-title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:27px;letter-spacing:.04em}

.footer-quote p{font-family:'Big Shoulders Display',sans-serif;font-size:25px;line-height:1.12;margin:8px 0 0;max-width:290px}

.social-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:#e7ece8;border:1px solid #26312a;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;transition:border-color .2s,background .2s,transform .2s}

.footer-bottom{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #26312a;padding-top:16px;margin-top:7px;color:#87958b;font-size:11px}
.made-by{letter-spacing:.12em}
.made-by strong{color:#f4f6f2;font-weight:800}
.heart{color:#ef625b}
.back-top{border:0;background:none;color:#b9ec50;font:inherit;cursor:pointer}
.cricket-art{position:absolute;right:3%;bottom:12px;width:240px;height:92px;opacity:.52;z-index:1;pointer-events:none}
.pitch-line{position:absolute;right:0;bottom:13px;width:220px;height:1px;background:linear-gradient(90deg,transparent,#71836f 25%,#71836f);transform:skewX(-25deg)}
.ball-trail{position:absolute;width:95px;height:30px;right:45px;top:10px;border-top:2px dashed rgba(185,236,80,.55);border-radius:50%;transform:rotate(-20deg);animation:trailPulse 2.8s ease-in-out infinite}
.cricket-ball{position:absolute;right:45px;top:13px;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ff8b80,#d6322e 65%,#811c1a);box-shadow:0 0 18px rgba(214,50,46,.35);animation:ballArc 2.8s cubic-bezier(.4,0,.2,1) infinite}
.cricket-ball i{position:absolute;top:2px;left:10px;height:19px;width:1px;background:#fff1e8;transform:rotate(28deg);opacity:.9}
.cricket-ball i+i{transform:rotate(-28deg)}
.ball-glow{position:absolute;right:30px;bottom:8px;width:44px;height:8px;background:#b9ec50;filter:blur(12px);opacity:.35;animation:glowPulse 2.8s ease-in-out infinite}
@keyframes ballArc{0%,100%{transform:translate(0,0) rotate(0)}45%{transform:translate(-78px,-26px) rotate(250deg)}70%{transform:translate(-115px,-5px) rotate(420deg)}}
@keyframes trailPulse{0%,100%{opacity:.35;transform:rotate(-20deg) scaleX(.75)}50%{opacity:1;transform:rotate(-20deg) scaleX(1.05)}}
@keyframes glowPulse{0%,100%{transform:scaleX(.6);opacity:.2}65%{transform:scaleX(1.2);opacity:.5}}
@media(max-width:760px){.top{padding:13px 16px;flex-wrap:wrap}.top-actions{gap:6px}.nav-btn{padding:7px 11px;font-size:13px}.footer-inner{grid-template-columns:1fr;gap:23px;padding:30px 20px 16px}.footer-bottom{flex-wrap:wrap}.footer-quote p{max-width:100%}.cricket-art{right:-35px;bottom:40px;opacity:.25}}
@media(prefers-reduced-motion:reduce){.cricket-ball,.ball-trail,.ball-glow{animation:none}}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem('crease'))}catch(e){return null}}
function save(){try{localStorage.setItem('crease',JSON.stringify(S))}catch(e){}}
let saved=load(),S=null,ui={ex:'',pick:null};
const I=()=>S.inn[S.cur];
const ovs=l=>Math.floor(l/6)+'.'+l%6;
const nm=k=>S[k];

/* Sound */
let AC,muted=false;
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type='sine',v=.25,f2){const c=ctx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d)}
function noise(d,v,fq,t=0){const c=ctx(),n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+t)}
function snd(k){if(muted)return;try{
 if(k==='dot')tone(170,0,.12,'square',.12);
 if(k==='run'){tone(520,0,.1,'triangle');tone(700,.08,.14,'triangle')}
 if(k==='four'){[523,659,784].forEach((f,i)=>tone(f,i*.09,.3,'triangle',.28));noise(.6,.5,1800)}
 if(k==='six'){[392,523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.5,'triangle',.28));noise(1.6,.7,1200);noise(1.2,.4,2600,.2)}
 if(k==='wicket'){tone(320,0,.5,'sawtooth',.3,70);tone(90,0,.35,'square',.3);noise(.25,.6,300)}
 if(k==='extra'){tone(230,0,.16,'square',.2);tone(230,.2,.16,'square',.2)}
 if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.4,'triangle',.3));noise(1.8,.6,1500)}
}catch(e){}}
function toggleMute(){muted=!muted;$('#mute').textContent=muted?'Sound off':'Sound on'}
function flash(t,c){const d=document.createElement('div');d.className='flash '+c;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);if(navigator.vibrate)navigator.vibrate(c==='out'?[60,40,60]:25)}

/* Navigation */
function go(s){S.screen=s;save();render()}
function home(){S=null;saved=load();render()}
function startNew(){S={screen:'teams',a:'',b:'',overs:20,sq:{a:[],b:[]},inn:[],cur:0,toss:null};save();render()}
function resume(){S=saved;render()}
function err(m){$('#err').textContent=m;return false}
function stepOf(n){return `<div class="step">Step ${n} of 5</div>`}

/* Views */
const V={};
V.home=()=>`<section class="hero"><div><h1>Score every ball.</h1><p>A ball-by-ball cricket scorer for your match: toss, openers, every over and every wicket, with a sound for each run, boundary and wicket.</p><div class="row"><button class="btn pri" onclick="startNew()">Start scoring</button>${saved&&saved.screen!=='home'?`<button class="btn ghost" onclick="resume()">Resume ${esc(saved.a)} v ${esc(saved.b)}</button>`:''}</div></div>
<div class="board"><div class="tm"><span>TEAM ESWAR XI</span><span>MARKET YARD</span></div><div class="big num">142/3</div><div class="tm" style="margin-bottom:16px"><span>16.4 overs</span><span>Run rate 8.52</span></div><div class="balls"><span class="b">1</span><span class="b f">4</span><span class="b">0</span><span class="b w">W</span><span class="b s">6</span><span class="b x">Wd</span></div></div></section>
<section class="feat"><div><b>Sounds that match the play</b>Different cues for dots, singles, fours, sixes and wickets.</div><div><b>No Login Required</b>Players Can Easily Add Their Score With Out Any Login Or Ads.</div><div><b>Saved as you go</b>Close the tab and pick the match up where you left it.</div></section>`;

V.teams=()=>`<div class="panel">${stepOf(1)}<h2>Who’s playing?</h2><p class="sub">Name both teams.</p><label for="ta">Team A</label><input type="text" id="ta" value="${esc(S.a)}" maxlength="30"><label for="tb">Team B</label><input type="text" id="tb" value="${esc(S.b)}" maxlength="30"><div class="err" id="err"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="home()">Cancel</button><button class="btn" onclick="goTeams()">Next</button></div></div>`;
function goTeams(){const a=$('#ta').value.trim(),b=$('#tb').value.trim();if(!a||!b)return err('Enter a name for both teams.');if(a.toLowerCase()===b.toLowerCase())return err('Team names must be different.');S.a=a;S.b=b;go('overs')}

V.overs=()=>`<div class="panel">${stepOf(2)}<h2>How many overs?</h2><p class="sub">Each side bats for this many overs.</p><div class="chips">${[1,2,5,10,20,50].map(n=>`<button class="chip ${S.overs===n?'on':''}" onclick="S.overs=${n};render()">${n}</button>`).join('')}</div><label for="co">Or enter your own (1–100)</label><input type="number" id="co" min="1" max="100" value="${S.overs}" onchange="setOv(this.value)"><div class="err" id="err"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="go('teams')">Back</button><button class="btn" onclick="setOv($('#co').value)&&go('squads')">Next</button></div></div>`;
function setOv(v){v=parseInt(v);if(!(v>=1&&v<=100)){err('Overs must be between 1 and 100.');return false}S.overs=v;return true}

V.squads=()=>`<div class="panel">${stepOf(3)}<h2>Add the players</h2><p class="sub">One name per line. You need at least 2 per team.</p>${['a','b'].map(k=>`<label for="s${k}">${esc(S[k])}</label><textarea id="s${k}" placeholder="Player 1&#10;Player 2&#10;…">${esc(S.sq[k].join('\n'))}</textarea><button class="btn ghost" style="padding:8px 14px;font-size:14px;margin-top:6px" onclick="fill('${k}')">Fill 11 placeholder names</button>`).join('')}<div class="err" id="err"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="go('overs')">Back</button><button class="btn" onclick="goSquads()">Next</button></div></div>`;
function fill(k){$('#s'+k).value=Array.from({length:11},(_,i)=>`${S[k]} ${i+1}`).join('\n')}
const parse=v=>[...new Set(v.split('\n').map(x=>x.trim()).filter(Boolean))];
function goSquads(){const a=parse($('#sa').value),b=parse($('#sb').value);S.sq={a,b};if(a.length<2||b.length<2)return err('Each team needs at least 2 different player names.');go('toss')}

V.toss=()=>{const t=S.toss;return `<div class="panel" style="text-align:center">${stepOf(4)}<h2>Toss the coin</h2><div class="coinw"><div class="coin" id="coin" style="transform:rotateY(${t&&t.res==='T'?180:0}deg)"><div class="face">H</div><div class="face t">T</div></div></div>${t?`<p class="sub"><b>${esc(nm(t.winner))}</b> won the toss. The coin landed ${t.res==='H'?'heads':'tails'}.</p><button class="btn pri" onclick="go('choice')">Continue</button>`:`<p class="sub">${esc(S.a)}, call it in the air.</p><div class="row" style="justify-content:center"><button class="btn" onclick="flip('H')">Heads</button><button class="btn" onclick="flip('T')">Tails</button></div>`}</div>`};
function flip(call){document.querySelectorAll('.panel .btn').forEach(b=>b.disabled=true);const res=Math.random()<.5?'H':'T',c=$('#coin');c.style.transition='transform 1.8s cubic-bezier(.2,.6,.2,1)';c.style.transform=`rotateY(${res==='H'?1800:1980}deg)`;try{tone(900,0,.1,'triangle')}catch(e){}setTimeout(()=>{S.toss={call,res,winner:call===res?'a':'b'};snd('win');save();render()},1950)}
V.choice=()=>`<div class="panel">${stepOf(5)}<h2>${esc(nm(S.toss.winner))} won the toss</h2><p class="sub">What do they want to do first?</p><div class="row"><button class="btn pri" onclick="choose('bat')">Bat first</button><button class="btn" onclick="choose('bowl')">Bowl first</button></div></div>`;

function newInn(k){return{bat:k,bowl:k==='a'?'b':'a',runs:0,wk:0,legal:0,orun:0,striker:null,non:null,bowler:null,prev:null,bt:{},bw:{},over:[],overs:[],hist:[],done:false}}
function choose(c){const w=S.toss.winner,o=w==='a'?'b':'a';S.inn=[newInn(c==='bat'?w:o)];S.cur=0;go('game')}
V.break=()=>{const i=S.inn[0];return `<div class="panel"><div class="step">Innings break</div><h2>${esc(nm(i.bat))}: ${i.runs}/${i.wk}</h2><p class="sub">${ovs(i.legal)} overs. ${esc(nm(i.bowl))} need <b>${i.runs+1}</b> to win from ${S.overs} overs.</p><button class="btn pri" onclick="S.cur=1;S.inn.push(newInn(S.inn[0].bowl));go('game')">Start second innings</button></div>`};

/* Scoring screen */
const chip=x=>`<span class="b ${x==='4'||/^Nb\+4/.test(x)?'f':x==='6'||/^Nb\+6/.test(x)?'s':x==='W'?'w':/^(Wd|Nb|B|LB)/i.test(x)&&isNaN(x)?'x':''}">${x}</span>`;
V.game=()=>{const i=I(),n=S.sq[i.bat].length,crr=i.legal?(i.runs/i.legal*6).toFixed(2):'0.00',tg=S.cur===1?S.inn[0].runs+1:0,left=S.overs*6-i.legal;
 const row=p=>{const b=i.bt[p];return b?`<tr><td>${esc(p)}${p===i.striker?' *':''}</td><td>${b.r}</td><td>${b.b}</td><td>${b.f4}/${b.f6}</td></tr>`:''};
 const bw=i.bowler&&i.bw[i.bowler];
 return `<div class="score"><small>${esc(nm(i.bat))} batting${S.cur?' · chasing '+tg:' · first innings'}</small><div class="num">${i.runs}/${i.wk}</div><small>${ovs(i.legal)} of ${S.overs} overs · Run rate ${crr}${tg?` · Need ${Math.max(tg-i.runs,0)} from ${left} balls`:''}</small></div>
<div class="g2"><div class="panel" style="margin:0;max-width:none;padding:20px"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s/6s</th></tr>${row(i.striker)}${row(i.non)}</table><div class="row" style="margin-top:14px;justify-content:space-between"><span class="hint">${i.bowler?`Bowler: <b>${esc(i.bowler)}</b> ${bw?ovs(bw.b)+'-'+bw.r+'-'+bw.w:''}`:''}</span><button class="btn ghost" style="padding:6px 12px;font-size:14px" onclick="swap()">Swap ends</button></div>
<div class="hint" style="margin-top:12px">This over</div><div class="balls">${i.over.map(chip).join('')||'<span class="hint">No balls yet</span>'}</div></div>
<div><div class="ex">${[['wd','Wide'],['nb','No ball'],['b','Bye'],['lb','Leg bye']].map(([k,l])=>`<button class="${ui.ex===k?'on':''}" onclick="ui.ex=ui.ex==='${k}'?'':'${k}';render()">${l}</button>`).join('')}</div>
<div class="hint">${ui.ex?'Now tap the runs scored (0 = just the extra).':'Tap the runs scored off this ball.'}</div>
<div class="pad">${[0,1,2,3,4,5,6].map(r=>`<button class="${r===4?'r4':r===6?'r6':''}" onclick="play(${r})">${r}</button>`).join('')}<button class="rw" onclick="wicketBtn()">Wicket</button></div>
<div class="row" style="justify-content:space-between"><button class="btn ghost" style="padding:8px 16px;font-size:15px" onclick="undo()" ${i.hist.length?'':'disabled'}>Undo last ball</button><span class="hint">${n-1-i.wk} wickets in hand</span></div></div></div>
${i.overs.length?`<div class="ovs panel" style="max-width:none;padding:20px"><h3 style="font-size:28px;margin-bottom:8px">Previous overs</h3>${i.overs.map((o,k)=>`<div><span class="n">Over ${k+1} · ${esc(o.b)} · ${o.r}</span><span class="balls">${o.balls.map(chip).join('')}</span></div>`).reverse().join('')}</div>`:''}`};

function snap(i){const{hist,...r}=i;i.hist.push(JSON.stringify(r));if(i.hist.length>40)i.hist.shift()}
function undo(){const i=I();if(!i.hist.length)return;const h=i.hist,s=JSON.parse(h.pop());for(const k in i)delete i[k];Object.assign(i,s,{hist:h});ui.ex='';save();render()}
function swap(){const i=I();[i.striker,i.non]=[i.non,i.striker];save();render()}
function play(r){const i=I(),ex=ui.ex,st=i.bt[i.striker],bw=i.bw[i.bowler];if(!st||!bw)return;snap(i);
 let runs=r,legal=true,bat=r,label=String(r),bowlerRuns;
 if(ex==='wd'){runs=1+r;legal=false;bat=0;label='Wd'+(r?'+'+r:'')}
 else if(ex==='nb'){runs=1+r;legal=false;label='Nb'+(r?'+'+r:'')}
 else if(ex==='b'||ex==='lb'){bat=0;label=(ex==='b'?'B':'LB')+r}
 bowlerRuns=(ex==='b'||ex==='lb')?0:runs;
 i.runs+=runs;i.orun+=runs;bw.r+=bowlerRuns;st.r+=bat;if(ex!=='wd')st.b++;
 if(bat===4)st.f4++;if(bat===6)st.f6++;
 if(legal){i.legal++;bw.b++}
 i.over.push(label);ui.ex='';
 if(r%2)[i.striker,i.non]=[i.non,i.striker];
 if(ex==='wd'||ex==='nb'){snd('extra');flash(ex==='wd'?'WIDE':'NO BALL','x')}
 else if(bat===6){snd('six');flash('SIX!','six')}
 else if(bat===4){snd('four');flash('FOUR!','four')}
 else if(r>0)snd('run');else snd('dot');
 finish(legal)}
function wicketBtn(){const i=I();if(!i.bowler)return;
 pick('How was the batter out?',['Bowled','Caught','LBW','Stumped','Hit wicket','Run out'].map(k=>({v:k,label:k})),k=>{
  if(k==='Run out')pick('Who is out?',[i.striker,i.non].map(p=>({v:p,label:p})),w=>doWicket(k,w));else doWicket(k,i.striker)})}
function doWicket(kind,who){const i=I(),ex=ui.ex,nl=ex==='wd'||ex==='nb',bw=i.bw[i.bowler];snap(i);ui.ex='';
 if(nl){i.runs++;i.orun++;bw.r++}else{i.legal++;bw.b++}
 if(ex!=='wd')i.bt[i.striker].b++;
 i.wk++;i.bt[who].out=kind==='Run out'?'Run out':kind+' · '+i.bowler;if(kind!=='Run out')bw.w++;
 if(i.striker===who)i.striker=null;else i.non=null;
 i.over.push('W');snd('wicket');flash('OUT!','out');finish(!nl)}
function closeOver(i){if(i.over.length){i.overs.push({b:i.bowler,balls:i.over,r:i.orun});i.over=[];i.orun=0}}
function finish(legal){const i=I();let end=i.legal>=S.overs*6||i.wk>=S.sq[i.bat].length-1||(S.cur===1&&i.runs>S.inn[0].runs);
 if(legal&&i.legal%6===0){closeOver(i);[i.striker,i.non]=[i.non,i.striker];i.prev=i.bowler;if(!end)i.bowler=null}
 if(end){closeOver(i);i.done=true;if(S.cur===0)S.screen='break';else{S.screen='result';setTimeout(()=>snd('win'),700)}}
 save();render()}

/* Pickers */
function pick(title,items,cb){ui.pick={title,items,cb};showPick()}
function showPick(){const p=ui.pick;$('#modal').innerHTML=p?`<div class="modal"><div class="mbox" role="dialog" aria-label="${esc(p.title)}"><h3>${esc(p.title)}</h3>${p.items.map((o,k)=>`<button class="opt" ${o.dis?'disabled':''} onclick="chosen(${k})"><span>${esc(o.label)}</span><small>${esc(o.sub||'')}</small></button>`).join('')}</div></div>`:''}
function chosen(k){const p=ui.pick;ui.pick=null;showPick();p.cb(p.items[k].v)}
function ensure(){if(ui.pick)return;const i=I();if(i.done)return;
 const slot=!i.striker?'striker':!i.non?'non':null;
 if(slot){const open=Object.keys(i.bt).length<2,left=S.sq[i.bat].filter(p=>!(p in i.bt));
  return pick(open?(slot==='striker'?'Who faces first ball?':'Who is at the other end?'):'Next batter in',left.map(p=>({v:p,label:p})),p=>{i[slot]=p;i.bt[p]={r:0,b:0,out:null,f4:0,f6:0};save();render()})}
 if(!i.bowler)pick(`Who bowls over ${i.overs.length+1}?`,S.sq[i.bowl].map(p=>{const b=i.bw[p];return{v:p,label:p,dis:p===i.prev,sub:p===i.prev?'Bowled last over':b?`${ovs(b.b)} ov · ${b.r} runs · ${b.w} wkts`:'Yet to bowl'}}),p=>{i.bowler=p;if(!i.bw[p])i.bw[p]={b:0,r:0,w:0};save();render()})}

/* Result */
function card(x){const i=S.inn[x];return `<div class="panel" style="max-width:none"><h3 style="font-size:34px">${esc(nm(i.bat))}: ${i.runs}/${i.wk} <small style="font-size:16px;color:var(--mut)">(${ovs(i.legal)} ov)</small></h3><table><tr><th>Batter</th><th>How out</th><th>R</th><th>B</th></tr>${Object.entries(i.bt).map(([p,b])=>`<tr><td>${esc(p)}</td><td>${b.out?esc(b.out):'not out'}</td><td>${b.r}</td><td>${b.b}</td></tr>`).join('')}</table><table style="margin-top:14px"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>${Object.entries(i.bw).map(([p,b])=>`<tr><td>${esc(p)}</td><td>${ovs(b.b)}</td><td>${b.r}</td><td>${b.w}</td></tr>`).join('')}</table></div>`}
V.result=()=>{const a=S.inn[0],b=S.inn[1];let t;
 if(b.runs>a.runs)t=`${nm(b.bat)} won by ${S.sq[b.bat].length-1-b.wk} wickets`;else if(a.runs>b.runs)t=`${nm(a.bat)} won by ${a.runs-b.runs} runs`;else t='Match tied';
 return `<div class="score" style="text-align:center"><small>Full time</small><div class="num" style="font-size:clamp(44px,8vw,84px)">${esc(t)}</div></div><div style="margin-top:18px">${card(0)}${card(1)}</div><div class="row"><button class="btn pri" onclick="startNew()">Score a new match</button><button class="btn ghost" onclick="home()">Home</button></div>`};

/* Render */
let lastScr;
function render(){const sc=S?S.screen:'home',v=V[sc];$('#app').innerHTML=v?v():V.home();if(sc!==lastScr){window.scrollTo(0,0);lastScr=sc}if(S&&S.screen==='game')ensure()}
render();
const fy=document.getElementById('footer-year');if(fy)fy.textContent=new Date().getFullYear();
</script>
</body>
</html>
